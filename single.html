<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bag Label Print - 90x70mm</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        /* ===== General Reset ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== Toolbar (Screen Only) ===== */
        .toolbar {
            margin-bottom: 20px;
            text-align: center;
        }

        .toolbar button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        /* ===== Label Container ===== */
        .label-container {
            width: 90mm;
            height: 70mm;
            background: white;
            border: 1px solid #ccc;
            /* Screen visual */
            padding: 3mm;
            /* 3mm Space as requested */
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Center content vertically */
            align-items: center;
            /* Center content horizontally */
            position: relative;
        }

        /* Content Wrapper */
        .content-wrapper {
            width: 100%;
            border: 1px solid #000;
            /* Border for the label box */
            padding: 2mm;
            display: flex;
            flex-direction: column;
            gap: 1.5mm;
            /* Space between rows */
        }

        /* Rows */
        .row {
            display: flex;
            font-size: 9pt;
            line-height: 1.2;
        }

        .label-text {
            font-weight: bold;
            width: 35%;
            text-align: left;
        }

        .value-text {
            width: 65%;
            text-align: left;
        }

        /* Barcode Section */
        .barcode-section {
            text-align: center;
            margin-top: 1.5mm;
            width: 100%;
        }

        .barcode-section svg {
            max-width: 100%;
            height: auto;
        }

        /* ===== PRINT STYLES ===== */
        @media print {
            @page {
                size: 90mm 70mm auto;
                /* Exact sticker size */
                margin: 0;

            }

            body {
                background: white;
                padding: 0;
                margin: 0;
                width: 90mm;
                height: 70mm;
            }

            .toolbar {
                display: none;
            }

            .label-container {
                width: 90mm;
                height: 70mm;
                border: none;
                padding: 3mm;
                /* Maintain internal spacing */
                page-break-after: always;
            }

            /* Ensure border prints correctly */
            .content-wrapper {
                border: 1px solid #000;
            }
        }
    </style>
</head>

<body>

    <!-- Toolbar -->
    <div class="toolbar">
        <button onclick="window.print()">🖨️ Print Label</button>
    </div>

    <!-- Label -->
    <div class="label-container">
        <div class="content-wrapper">
            <div class="row">
                <span class="label-text">Bag No:</span>
                <span class="value-text">08092026</span>
            </div>
            <div class="row">
                <span class="label-text">Type of Bag:</span>
                <span class="value-text">Triple Bag 350ml</span>
            </div>
            <div class="row">
                <span class="label-text">Bleeding Date:</span>
                <span class="value-text">07/09/2026 13.00</span>
            </div>
            <div class="row">
                <span class="label-text">Serment No:</span>
                <span class="value-text">5k 222dR4</span>
            </div>
            <div class="row">
                <span class="label-text">Component:</span>
                <span class="value-text">Packed Cell</span>
            </div>
            <div class="row">
                <span class="label-text">Expiry Date:</span>
                <span class="value-text">19/10/2026</span>
            </div>
            <div class="row">
                <span class="label-text">Blood Group:</span>
                <span class="value-text">A Positive</span>
            </div>

            <div class="barcode-section">
                <svg id="barcode"></svg>
            </div>
        </div>
    </div>

    <script>
        // Generate Barcode
        JsBarcode("#barcode", "08092026-1", {
            format: "CODE128",
            width: 1.5, // Adjust width to fit
            height: 35,
            displayValue: true,
            fontSize: 10,
            margin: 0
        });
    </script>
</body>

</html>
